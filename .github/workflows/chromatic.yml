# Publica o Storybook do Terra DS no Chromatic (hospedagem + testes visuais).
# Token do projeto: secret CHROMATIC_PROJECT_TOKEN (Settings → Secrets and variables → Actions).

name: TERRA | DS | CHROMATIC

on:
  push:
    branches:
      - main
      - homolog
  pull_request:
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static-terra
          exitZeroOnChanges: true
          autoAcceptChanges: main
