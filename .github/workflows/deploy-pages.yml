# GitHub Pages: Storybook do Terra DS na raiz do site
# → https://<org>.github.io/<repo>/
#
# CSS/fonts usam STORYBOOK_BASE_TERRA no `npm run compile:styles`;
# o `base` do Storybook usa STORYBOOK_BASE no build.

name: TERRA | DS | DEPLOY PAGES

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PAGES_ROOT: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@teddy-conkey"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook — Terra DS
        env:
          STORYBOOK_BASE: ${{ env.PAGES_ROOT }}
          STORYBOOK_BASE_TERRA: ${{ env.PAGES_ROOT }}
        run: npm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static-terra

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
