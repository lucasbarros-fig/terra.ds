<jv-shell menu="propostas" title="Propostas" [breadcrumbs]="[{ label: 'Home' }, { label: 'Propostas' }]" (nav)="nav.emit($event)">
  <div class="pp" #area>
    <div class="pp-barra" role="search">
      <div class="pp-campos">
        <lib-input-text class="pp-campo" variant="outlined" iconBefore="MagnifyingGlass" placeholder="Pesquise por clientes" inputAriaLabel="Pesquisar propostas por cliente" [clearable]="true" [ngModel]="busca()" (ngModelChange)="busca.set($event ?? '')"></lib-input-text>
        <lib-select class="pp-campo" variant="outlined" iconBefore="CalendarDots" placeholder="Período" selectAriaLabel="Período" [options]="opPeriodos" [ngModel]="periodo() === 'todos' ? null : periodo()" (selectionChange)="periodo.set($any($event) || 'todos')"></lib-select>
        <lib-select class="pp-campo" variant="outlined" iconBefore="Briefcase" placeholder="Produto" selectAriaLabel="Produto" [multiple]="true" [options]="opProdutos()" [ngModel]="produto()" (selectionChange)="produto.set(lista($event))"></lib-select>
      </div>
      <div class="pp-acoes">
        <lib-button intent="neutral" variant="filled" icon="DownloadSimple" label="Exportar relatório" (clicked)="exportar()"></lib-button>
        <lib-icon-button type="branding" variant="filled" icon="Plus" ariaLabel="Nova proposta" (clicked)="nav.emit('nova')"></lib-icon-button>
      </div>
    </div>

    <div class="pp-quadro" #quadro tabindex="0" aria-label="Quadro de propostas por etapa">
      @for (c of colunas(); track c.id) {
        <section class="pp-col" [style.--cor]="c.cor" [attr.aria-label]="c.label + ', ' + c.cards.length + (c.cards.length === 1 ? ' proposta' : ' propostas')">
          <header class="pp-col-titulo">
            <span class="pp-col-icone"><lib-icon [icon]="c.icon" [size]="24" color="inherit"></lib-icon></span>
            <div class="pp-col-txt"><h2>{{ c.label }}</h2><p>{{ brl(c.total) }}</p></div>
          </header>
          <div class="pp-col-div" aria-hidden="true"><span></span></div>
          <p class="pp-col-qtd"><span>Propostas</span><span>{{ c.cards.length }}</span></p>
          <div class="pp-col-lista">
            @for (p of c.cards; track p.id) {
              <lib-card-kanban
                [type]="p.tipo"
                [proposalId]="'#' + p.id"
                [clientName]="p.cliente"
                [product]="p.produto"
                [amount]="brl(p.valor)"
                [statusLabel]="p.status"
                [statusColor]="corStatus(p.status)"
                statusIcon="CircleNotch"
                [comments]="p.comentarios ?? 0"
                [hideZeroComments]="false"
                [time]="tempo(p)"
                [timeLabel]="'há ' + tempo(p) + ' na etapa'"
                (cardClick)="ver(p)"
                (menuClick)="abrirMenu($event, p)"
              ></lib-card-kanban>
            } @empty {
              <div class="pp-col-vazia">
                <lib-icon icon="Folder" [size]="20" color="inherit"></lib-icon>
                <p>As propostas aparecerão aqui quando chegarem nesta etapa.</p>
              </div>
            }
          </div>
        </section>
      }
    </div>

    <lib-tooltip class="pp-mapa-pos" indicator="top" arrow="end" [openDelay]="600" text="Use o scroll lateral para navegar entre as etapas.">
    <jv-anim-scroll-lateral tooltipMedia></jv-anim-scroll-lateral>
    <nav class="pp-mapa" aria-label="Ir para a etapa">
      <div class="pp-mapa-trilho">
      @for (c of colunas(); track c.id; let i = $index) {
        <button type="button" class="pp-mapa-col" [attr.aria-label]="'Ir para ' + c.label" (click)="irPara(i)"></button>
      }
      <span class="pp-mapa-janela" aria-hidden="true" [style.left.%]="janela().ini" [style.width.%]="janela().larg"></span>
      </div>
    </nav>
    </lib-tooltip>

    @if (menu(); as m) {
      <jv-menu-flutuante
        [itens]="[{ value: 'ver', label: 'Ver proposta', icon: 'eye--duotone' }, { value: 'transferir', label: 'Transferir proposta', icon: 'arrange-horizontal--duotone' }, { value: 'cancelar', label: 'Cancelar proposta', icon: 'close-circle--duotone' }]"
        [pos]="m.pos" rotulo="Ações da proposta" (escolher)="acao($event)" (fechar)="menu.set(null)"
      ></jv-menu-flutuante>
    }
  </div>
</jv-shell>
