<td
	[class.lib-list-td--title]="kind === 'title'"
	[class.lib-list-td--actions]="kind === 'actions'"
	[style.text-align]="align"
	[attr.colspan]="colspan === null ? null : colspan"
>
	<span class="lib-list-body-cell-content">
		<span *ngIf="label && kind === 'default'" class="lib-list-body-cell-label" aria-hidden="true">{{ label }}</span>
		<lib-icon
			*ngIf="icon && iconPosition === 'before'"
			[icon]="icon"
			[size]="iconSize"
			[color]="iconColor"
		></lib-icon>
		<span
			class="lib-list-body-cell-text"
			#text
			(mouseenter)="syncOverflowTitle(text)"
		>
			<ng-content></ng-content>
		</span>
		<lib-icon
			*ngIf="icon && iconPosition === 'after'"
			[icon]="icon"
			[size]="iconSize"
			[color]="iconColor"
		></lib-icon>
		<lib-tooltip
			*ngIf="tooltip"
			[text]="tooltip"
			arrow="middle"
			indicator="top"
			triggerIcon="Info"
			[triggerIconColor]="iconColor"
		></lib-tooltip>
	</span>
</td>
