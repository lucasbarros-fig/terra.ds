<div class="clock-picker-panel">
	@if (showHeader() && title()) {
		<p class="clock-picker-title">{{ title() }}</p>
	}

	<div class="clock-picker-columns">
		<ng-container *ngTemplateOutlet="column; context: { $implicit: 'hour', label: hourLabel(), options: hourOptions(), current: draftHour() }"></ng-container>
		<span class="clock-picker-divider" aria-hidden="true"></span>
		<ng-container *ngTemplateOutlet="column; context: { $implicit: 'minute', label: minuteLabel(), options: minuteOptions(), current: draftMinute() }"></ng-container>
	</div>

	@if (showFooter()) {
		<div class="clock-picker-footer">
			<lib-button class="clock-picker-action" intent="neutral" variant="ghost" [fullWidth]="true" [label]="cancelLabel()" (clicked)="onCancel()"></lib-button>
			<lib-button class="clock-picker-action" intent="branding" variant="filled" [fullWidth]="true" [label]="applyLabel()" [disabled]="!canApply()" (clicked)="onApply()"></lib-button>
		</div>
	}
</div>

<ng-template #column let-kind let-label="label" let-options="options" let-current="current">
	<div class="clock-picker-column">
		<span class="clock-picker-column-label" [id]="optionId(kind, -1)">{{ label }}</span>
		<div
			#list
			class="clock-picker-list"
			role="listbox"
			tabindex="-1"
			[attr.aria-labelledby]="optionId(kind, -1)"
			(keydown)="onColumnKeydown($event, kind)"
		>
			@for (option of options; track option.value) {
				<button
					type="button"
					role="option"
					class="clock-picker-item"
					[id]="optionId(kind, option.value)"
					[class.is-selected]="option.value === current"
					[attr.aria-selected]="option.value === current"
					[disabled]="option.disabled"
					[tabindex]="option.value === current || (current === null && $first) ? 0 : -1"
					(click)="kind === 'hour' ? selectHour(option) : selectMinute(option)"
				>
					{{ option.label }}
				</button>
			}
		</div>
	</div>
</ng-template>
