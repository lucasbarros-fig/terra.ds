<div
  class="tooltip-container"
  [ngClass]="[indicator, arrow]"
  [class.is-open]="hoverInside"
  [class.has-media]="!!media || hasProjectedMedia"
  (mouseenter)="onContainerEnter()"
  (mouseleave)="onContainerLeave()"
  (focusin)="onContainerEnter(true)"
  (focusout)="onContainerLeave()"
>
  <span class="trigger">
    <span class="trigger-projection" #projection>
      <ng-content></ng-content>
    </span>
    <lib-icon
      *ngIf="!hasProjectedTrigger"
      [icon]="triggerIcon"
      [size]="triggerSize"
      [color]="triggerIconColor"
    ></lib-icon>
  </span>

  <div class="dropdown" role="tooltip" [attr.aria-hidden]="!hoverInside">
    <span class="dropdown-media-slot" #mediaSlot [class.is-empty]="!hasProjectedMedia">
      <ng-content select="[tooltipMedia]"></ng-content>
    </span>
    <img
      *ngIf="media && !hasProjectedMedia"
      class="dropdown-media"
      [src]="media"
      [attr.alt]="mediaAlt"
    />
    <p *ngIf="text" class="dropdown-text">{{ text }}</p>
  </div>

  <svg
    class="caret"
    [attr.viewBox]="caretViewBox"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    <path class="caret-fill" [attr.d]="caretFillPath" />
    <path class="caret-stroke" [attr.d]="caretStrokePath" />
  </svg>
</div>
