<div class="goal-progress-top">
  <span class="goal-progress-label">{{ label() }}</span>
  <span class="goal-progress-value">{{ valueText() }}</span>
</div>

<div
  class="goal-progress-track"
  [class]="'goal-progress-track--' + status()"
  role="progressbar"
  [attr.aria-label]="label()"
  [attr.aria-valuenow]="clampedValue()"
  aria-valuemin="0"
  [attr.aria-valuemax]="safeMax()"
  [attr.aria-valuetext]="computedValueText()"
>
  @if (progress() > 0) {
    <span class="goal-progress-bar" [style.width.%]="progress() * 100"></span>
  }

  @if (targetPosition() !== null) {
    <span class="goal-progress-target-layer" aria-hidden="true">
      <span class="goal-progress-target" [style.--goal-progress-target]="targetPosition()"></span>
    </span>
  }
</div>

<div class="goal-progress-status">
  <lib-status size="small" [status]="status()" [text]="statusLabel()"></lib-status>
  @if (note()) {
    <span class="goal-progress-note">{{ note() }}</span>
  }
</div>
