<div class="toast-container">
  <div class="toast-status">
      <lib-icon [icon]="resolvedIcon" [size]="20" [color]="state() !== 'warning' ? 'var(--color-icons-static-white)' : 'inherit'"></lib-icon>

    <span class="toast-state-label">{{ resolvedStateLabel }}</span>
  </div>

  <div class="toast-row">
    <div class="toast-text">
      <span class="toast-label">{{ label() }}</span>
    </div>
    <lib-divisor orientation="vertical"></lib-divisor>
    <button class="toast-close" type="button" (click)="close()" aria-label="Fechar">
      <div class="toast-close-icon">
        <lib-icon icon="x" [size]="16"></lib-icon>
      </div>
    </button>
  </div>
</div>
